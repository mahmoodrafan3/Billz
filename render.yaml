services:
  - type: web
    name: billz
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@latest --activate && pnpm install && cd apps/web && pnpm install && pnpm build && pip install pymupdf
    startCommand: cd apps/api && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /api/health
    autoDeploy: true
