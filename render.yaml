services:
  - type: web
    name: billz
    runtime: node
    plan: free
    buildCommand: npx pnpm install && cd apps/web && npx pnpm install && npx pnpm build && pip install pymupdf
    startCommand: cd apps/api && npx tsx src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /api/health
    autoDeploy: true
